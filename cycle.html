<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="favicon.png" />
  <title>色彩循环 · Color Cycle</title>

  <style>
    /* ============================================================
       全局样式
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: #0f0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #1a1a1a;
      border-radius: 20px;
      padding: 40px 36px 32px;
      max-width: 520px;
      width: 100%;
      border: 1px solid #2a2a2a;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      transition: border-color 0.3s;
    }

    /* ============================================================
       标题
       ============================================================ */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .header .badge {
      font-size: 0.7rem;
      color: #8a8a8a;
      background: #2a2a2a;
      padding: 4px 12px;
      border-radius: 40px;
      border: 1px solid #3a3a3a;
    }

    /* ============================================================
       颜色预览方块
       ============================================================ */
    .color-preview {
      width: 100%;
      height: 180px;
      border-radius: 14px;
      border: 2px solid #2a2a2a;
      transition: background-color 0.1s, border-color 0.3s;
      margin-bottom: 20px;
      background-color: #ff5733;
      box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    /* ============================================================
       当前颜色值显示
       ============================================================ */
    .color-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f0f0f;
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 24px;
      border: 1px solid #2a2a2a;
    }

    .color-display .hex {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 1.1rem;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .color-display .hex span {
      color: #8a8a8a;
      font-weight: 400;
    }

    .color-display .hsl {
      font-size: 0.85rem;
      color: #8a8a8a;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* ============================================================
       控制区域
       ============================================================ */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-row {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-row label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #b0b0b0;
      min-width: 56px;
    }

    /* ---- 颜色选择器 ---- */
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 140px;
    }

    input[type="color"] {
      width: 44px;
      height: 44px;
      padding: 2px;
      border: 2px solid #2a2a2a;
      border-radius: 10px;
      cursor: pointer;
      background: #0f0f0f;
      transition: border-color 0.3s;
    }

    input[type="color"]:hover {
      border-color: #4a4a4a;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 8px;
    }

    .color-picker-wrapper .hint {
      font-size: 0.8rem;
      color: #6a6a6a;
    }

    /* ---- 速率控制 ---- */
    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 120px;
    }

    .speed-control input[type="range"] {
      flex: 1;
      min-width: 80px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #2a2a2a;
      border-radius: 4px;
      outline: none;
      transition: background 0.3s;
    }

    .speed-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .speed-control input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }

    .speed-control input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      border: none;
    }

    .speed-control .speed-value {
      font-size: 0.85rem;
      font-weight: 500;
      color: #ffffff;
      min-width: 36px;
      text-align: center;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* ---- 步长控制 ---- */
    .step-control {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 100px;
    }

    .step-control input[type="number"] {
      width: 64px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      background: #0f0f0f;
      color: #ffffff;
      font-size: 0.9rem;
      text-align: center;
      font-family: 'SF Mono', 'Fira Code', monospace;
      transition: border-color 0.3s;
    }

    .step-control input[type="number"]:focus {
      outline: none;
      border-color: #4a4a4a;
    }

    .step-control input[type="number"]::-webkit-inner-spin-button,
    .step-control input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .step-control input[type="number"] {
      -moz-appearance: textfield;
    }

    /* ---- 按钮 ---- */
    .btn {
      padding: 10px 28px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      min-width: 100px;
      font-family: inherit;
    }

    .btn-start {
      background: #4caf50;
      color: #ffffff;
    }

    .btn-start:hover {
      background: #43a047;
      transform: scale(1.02);
    }

    .btn-start:active {
      transform: scale(0.96);
    }

    .btn-start.running {
      background: #f44336;
    }

    .btn-start.running:hover {
      background: #d32f2f;
    }

    /* ============================================================
       状态提示
       ============================================================ */
    .status {
      text-align: center;
      font-size: 0.8rem;
      color: #6a6a6a;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #1a1a1a;
      transition: color 0.3s;
    }

    .status.active {
      color: #4caf50;
    }

    .status .hint-key {
      color: #4a4a4a;
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #0f0f0f;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #1a1a1a;
    }
    /* ===== 返回按钮 ===== */
    .back-btn {
      text-decoration: none;
      font-size: 1.3rem;
      color: #b0b0b0;
      transition: color 0.2s;
      line-height: 1;
      padding: 4px 8px 4px 0;
      display: inline-block;
    }

    .back-btn:hover {
      color: #2c2c2c;
    }
    /* ============================================================
       响应式
       ============================================================ */
    @media (max-width: 480px) {
      .container {
        padding: 24px 18px 20px;
      }

      .color-preview {
        height: 140px;
      }

      .control-row {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .control-row label {
        min-width: auto;
      }

      .color-picker-wrapper,
      .speed-control,
      .step-control {
        min-width: auto;
        width: 100%;
      }

      .btn {
        width: 100%;
        padding: 12px;
      }

      .color-display {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .header h1 {
        font-size: 1.1rem;
      }
      
    }
  </style>
</head>

<body>
  
  <div class="container">

    <!-- ===== 标题 ===== -->
    <div class="header">
      <div style="display:flex; align-items:center; gap:10px;">
    <a href="index.html" style="text-decoration:none; font-size:1.4rem; color:#8a8a8a; transition:0.2s;" onmouseover="this.style.color='#2c2c2c'" onmouseout="this.style.color='#8a8a8a'">←</a>
    <h1 style="margin:0;">🌀 色彩循环</h1>
  </div>
      <span class="badge">HSL 平滑旋转</span>
    </div>

    <!-- ===== 颜色预览 ===== -->
    <div class="color-preview" id="colorPreview"></div>

    <!-- ===== 颜色值显示 ===== -->
    <div class="color-display">
      <div class="hex">
        HEX <span id="hexDisplay">#FF5733</span>
      </div>
      <div class="hsl" id="hslDisplay">HSL(0°, 100%, 50%)</div>
    </div>

    <!-- ===== 控制区域 ===== -->
    <div class="controls">

      <!-- 第1行：颜色选择器 -->
      <div class="control-row">
        <label>起始颜色</label>
        <div class="color-picker-wrapper">
          <input type="color" id="colorPicker" value="#ff5733" />
          <span class="hint">点击选择</span>
        </div>
      </div>

      <!-- 第2行：速率 + 步长 -->
      <div class="control-row">
        <label>速度</label>
        <div class="speed-control">
          <input type="range" id="speedSlider" min="1" max="20" value="4" />
          <span class="speed-value" id="speedDisplay">4</span>
        </div>

        <label>步长</label>
        <div class="step-control">
          <input type="number" id="stepInput" min="1" max="30" value="2" />
        </div>
      </div>

      <!-- 第3行：按钮 -->
      <div class="control-row">
        <button class="btn btn-start" id="toggleBtn">▶ 开始</button>
      </div>

    </div>

    <!-- ===== 状态提示 ===== -->
    <div class="status" id="statusText">
      💡 点击 <span class="hint-key">开始</span> 颜色将沿色相环平滑旋转
    </div>

  </div>

  <script>
    // ================================================================
    // 🎨 Color Cycle · 色彩循环 —— 完整 JavaScript
    // ================================================================

    // ---- DOM 元素 ----
    const preview = document.getElementById('colorPreview')
    const hexDisplay = document.getElementById('hexDisplay')
    const hslDisplay = document.getElementById('hslDisplay')
    const colorPicker = document.getElementById('colorPicker')
    const speedSlider = document.getElementById('speedSlider')
    const speedDisplay = document.getElementById('speedDisplay')
    const stepInput = document.getElementById('stepInput')
    const toggleBtn = document.getElementById('toggleBtn')
    const statusText = document.getElementById('statusText')

    // ---- 状态 ----
    let isRunning = false          // 是否正在运行
    let animationId = null        // requestAnimationFrame ID
    let lastUpdateTime = 0        // 上次更新时间（用于节流）
    let hue = 0                  // 当前色相值 (0-360)
    let step = 2                 // 每次变化的步长
    let speed = 4                // 速度因子 (1-20)

    // ---- 初始化 ----
    function init() {
      // 从颜色选择器读取初始颜色
      const initialColor = colorPicker.value
      const rgb = hexToRgb(initialColor)
      const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b)
      hue = hsl.h

      // 更新预览和显示
      updatePreview(hue)
      updateDisplays(hue)
      updateStatus('idle')
    }

    // ================================================================
    // 颜色转换工具
    // ================================================================

    // 将十六进制颜色字符串（如 #FF5733）转为 RGB 对象
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)
      if (!result) return { r: 0, g: 0, b: 0 }
      return {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      }
    }

    // 将 RGB 转为 HSL（h 为 0-360, s 和 l 为 0-100）
    function rgbToHsl(r, g, b) {
      const r1 = r / 255
      const g1 = g / 255
      const b1 = b / 255
      const max = Math.max(r1, g1, b1)
      const min = Math.min(r1, g1, b1)
      let h, s, l = (max + min) / 2

      if (max === min) {
        h = 0
        s = 0
      } else {
        const d = max - min
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
        switch (max) {
          case r1:
            h = ((g1 - b1) / d + (g1 < b1 ? 6 : 0)) / 6
            break
          case g1:
            h = ((b1 - r1) / d + 2) / 6
            break
          case b1:
            h = ((r1 - g1) / d + 4) / 6
            break
        }
      }

      return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
      }
    }

    // 将 HSL 转为十六进制颜色字符串
    function hslToHex(h, s, l) {
      // 先转 RGB
      const s1 = s / 100
      const l1 = l / 100
      const c = (1 - Math.abs(2 * l1 - 1)) * s1
      const x = c * (1 - Math.abs((h / 60) % 2 - 1))
      const m = l1 - c / 2
      let r, g, b

      if (h >= 0 && h < 60) { r = c;
        g = x;
        b = 0 } else if (h >= 60 && h < 120) { r = x;
        g = c;
        b = 0 } else if (h >= 120 && h < 180) { r = 0;
        g = c;
        b = x } else if (h >= 180 && h < 240) { r = 0;
        g = x;
        b = c } else if (h >= 240 && h < 300) { r = x;
        g = 0;
        b = c } else { r = c;
        g = 0;
        b = x }

      const r255 = Math.round((r + m) * 255)
      const g255 = Math.round((g + m) * 255)
      const b255 = Math.round((b + m) * 255)

      return '#' + [r255, g255, b255]
        .map(c => c.toString(16).padStart(2, '0'))
        .join('')
    }

    // ================================================================
    // 更新界面
    // ================================================================

    // 更新预览方块和背景
    function updatePreview(hueValue) {
      const color = hslToHex(hueValue, 80, 55)
      preview.style.backgroundColor = color
      // 边框颜色跟随主色
      preview.style.borderColor = color
      // 容器的边框也轻微变化，增加沉浸感
      document.querySelector('.container').style.borderColor = color + '44'
    }

    // 更新显示数值
    function updateDisplays(hueValue) {
      const color = hslToHex(hueValue, 80, 55)
      hexDisplay.textContent = color.toUpperCase()

      // 显示 HSL
      const hsl = rgbToHsl(
        parseInt(color.slice(1, 3), 16),
        parseInt(color.slice(3, 5), 16),
        parseInt(color.slice(5, 7), 16)
      )
      hslDisplay.textContent = `HSL(${hsl.h}°, ${hsl.s}%, ${hsl.l}%)`
    }

    // 更新状态提示
    function updateStatus(state) {
      switch (state) {
        case 'idle':
          statusText.innerHTML =
            '💡 点击 <span class="hint-key">开始</span> 颜色将沿色相环平滑旋转'
          statusText.className = 'status'
          break
        case 'running':
          statusText.textContent = '⏳ 颜色正在循环...'
          statusText.className = 'status active'
          break
        case 'stopped':
          statusText.innerHTML = '⏸️ 已暂停 · 点击 <span class="hint-key">开始</span> 继续'
          statusText.className = 'status'
          break
      }
    }

    // ================================================================
    // 核心循环逻辑
    // ================================================================

    function cycleColor(timestamp) {
      if (!isRunning) return

      // 计算时间间隔（节流）
      const interval = 1000 / speed  // speed 越大越快
      if (timestamp - lastUpdateTime >= interval) {
        lastUpdateTime = timestamp

        // 步长
        const stepValue = parseInt(stepInput.value) || 2
        // 色相增加
        hue = (hue + stepValue) % 360

        // 更新预览和显示
        updatePreview(hue)
        updateDisplays(hue)
      }

      // 继续下一帧
      animationId = requestAnimationFrame(cycleColor)
    }

    // ================================================================
    // 控制函数
    // ================================================================

    function startCycle() {
      if (isRunning) return

      // 从颜色选择器同步起始色相（允许用户中途改起始颜色）
      const rgb = hexToRgb(colorPicker.value)
      const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b)
      hue = hsl.h

      isRunning = true
      lastUpdateTime = 0
      toggleBtn.textContent = '⏹ 停止'
      toggleBtn.classList.add('running')
      updateStatus('running')

      // 禁用颜色选择和步长（项目要求：运行中不可更改）
      colorPicker.disabled = true
      stepInput.disabled = true

      // 开始循环
      animationId = requestAnimationFrame(cycleColor)
    }

    function stopCycle() {
      if (!isRunning) return

      isRunning = false
      if (animationId) {
        cancelAnimationFrame(animationId)
        animationId = null
      }

      toggleBtn.textContent = '▶ 开始'
      toggleBtn.classList.remove('running')
      updateStatus('stopped')

      // 恢复编辑
      colorPicker.disabled = false
      stepInput.disabled = false
    }

    function toggleCycle() {
      if (isRunning) {
        stopCycle()
      } else {
        startCycle()
      }
    }

    // ================================================================
    // 事件绑定
    // ================================================================

    // 切换按钮
    toggleBtn.addEventListener('click', toggleCycle)

    // 颜色选择器：更新起始颜色
    colorPicker.addEventListener('input', function() {
      if (isRunning) return  // 运行中不可更改

      const rgb = hexToRgb(this.value)
      const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b)
      hue = hsl.h
      updatePreview(hue)
      updateDisplays(hue)
      updateStatus('idle')
    })

    // 速度滑块
    speedSlider.addEventListener('input', function() {
      speed = parseInt(this.value)
      speedDisplay.textContent = speed
    })

    // 步长输入
    stepInput.addEventListener('change', function() {
      let val = parseInt(this.value) || 2
      if (val < 1) val = 1
      if (val > 30) val = 30
      this.value = val
    })

    // 键盘快捷键：空格切换
    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' && e.target.type !== 'button') return
      if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault()
        toggleCycle()
      }
    })

    // ================================================================
    // 启动
    // ================================================================

    init()

    // 窗口卸载时清理动画
    window.addEventListener('beforeunload', function() {
      if (animationId) {
        cancelAnimationFrame(animationId)
      }
    })

    console.log('🎨 Color Cycle 已启动！')
    console.log('💡 按 空格键 快速切换 开始/停止')
  </script>

</body>
</html>

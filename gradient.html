<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌅 莫兰迪渐变色</title>

  <style>
    /* ============================================================
       全局样式
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: #f5f0eb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      background: #ffffff;
      border-radius: 24px;
      padding: 28px 28px 20px;
      max-width: 780px;
      width: 100%;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.06);
    }

    /* ===== 标题栏 ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .back-btn {
      text-decoration: none;
      font-size: 1.3rem;
      color: #b0b0b0;
      transition: color 0.2s;
      line-height: 1;
    }

    .back-btn:hover {
      color: #2c2c2c;
    }

    .header-left h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #2c2c2c;
    }

    .family-tags {
      display: inline-flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .family-tag {
      font-size: 0.6rem;
      padding: 2px 10px;
      border-radius: 40px;
      background: #f0ece6;
      color: #6a6a6a;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 7px 18px;
      border: none;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
    }

    .btn-primary {
      background: #2c2c2c;
      color: #fff;
    }
    .btn-primary:hover {
      background: #1a1a1a;
      transform: scale(1.02);
    }

    /* ===== 渐变色带预览 ===== */
    .gradient-preview {
      width: 100%;
      height: 100px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid #f0ece6;
      transition: background 0.3s ease;
      background: linear-gradient(90deg, #e8d5c4, #d4c4b8, #c4b8a8, #b8a898, #a89888);
    }

    /* ===== 5色块展示 ===== */
    .color-stops {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .color-stop-item {
      background: #faf8f5;
      border-radius: 12px;
      padding: 10px 8px 8px;
      border: 1px solid #f0ece6;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
    }

    .color-stop-item:hover {
      transform: translateY(-3px);
      border-color: #2c2c2c;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .color-stop-swatch {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 8px;
      margin-bottom: 6px;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .color-stop-hex {
      font-size: 0.65rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #6a6a6a;
      letter-spacing: 0.3px;
      display: block;
    }

    .color-stop-hsl {
      font-size: 0.55rem;
      color: #b0b0b0;
      display: block;
      margin-top: 2px;
    }

    /* ===== 方向控制 ===== */
    .direction-control {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .dir-btn {
      padding: 6px 18px;
      border-radius: 30px;
      border: 2px solid #e8e4de;
      background: transparent;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
      color: #8a8a8a;
    }

    .dir-btn:hover {
      border-color: #b0b0b0;
      color: #2c2c2c;
    }

    .dir-btn.active {
      border-color: #2c2c2c;
      background: #2c2c2c;
      color: #ffffff;
    }

    /* ===== CSS 代码展示 ===== */
    .code-box {
      background: #faf8f5;
      border: 1px solid #f0ece6;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .code-box code {
      font-size: 0.75rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #2c2c2c;
      word-break: break-all;
      flex: 1;
      min-width: 120px;
      line-height: 1.5;
    }

    .code-box .copy-btn {
      background: transparent;
      border: 1px solid #e0dcd6;
      border-radius: 30px;
      padding: 4px 14px;
      font-size: 0.7rem;
      color: #6a6a6a;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      flex-shrink: 0;
    }

    .code-box .copy-btn:hover {
      border-color: #2c2c2c;
      color: #2c2c2c;
    }

    .code-box .copy-btn.copied {
      border-color: #2c7a4a;
      color: #2c7a4a;
      background: #eaf5ee;
    }

    /* ===== Toast ===== */
    .toast {
      text-align: center;
      font-size: 0.8rem;
      color: #8a8a8a;
      padding: 4px 0;
      min-height: 28px;
      transition: opacity 0.3s;
    }

    .toast.active {
      color: #2c7a4a;
      font-weight: 500;
    }

    /* ===== 底部 ===== */
    .footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #f0ece6;
      font-size: 0.7rem;
      color: #c0c0c0;
      flex-wrap: wrap;
      gap: 8px;
    }

    .footer-info kbd {
      background: #f5f0eb;
      padding: 2px 10px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.6rem;
      color: #8a8a8a;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 500px) {
      .container {
        padding: 16px 12px 12px;
      }
      .gradient-preview {
        height: 70px;
      }
      .color-stops {
        gap: 6px;
      }
      .color-stop-hex {
        font-size: 0.55rem;
      }
      .color-stop-hsl {
        font-size: 0.5rem;
      }
      .dir-btn {
        font-size: 0.7rem;
        padding: 4px 12px;
      }
      .code-box code {
        font-size: 0.65rem;
      }
      .header-left h1 {
        font-size: 1rem;
      }
    }

    @media (max-width: 400px) {
      .color-stops {
        gap: 4px;
      }
      .color-stop-item {
        padding: 6px 4px 4px;
      }
      .color-stop-swatch {
        aspect-ratio: 1 / 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ===== 标题栏 ===== -->
    <div class="header">
      <div class="header-left">
        <a href="index.html" class="back-btn" title="返回">←</a>
        <h1>🌅 莫兰迪渐变色</h1>
        <span class="family-tags" id="familyTags"></span>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" id="generateBtn">✨ 生成</button>
      </div>
    </div>

    <!-- ===== 渐变色带预览 ===== -->
    <div class="gradient-preview" id="gradientPreview"></div>

    <!-- ===== 5色块展示 ===== -->
    <div class="color-stops" id="colorStops"></div>

    <!-- ===== 方向控制 ===== -->
    <div class="direction-control" id="directionControl">
      <button class="dir-btn active" data-dir="to right">水平 →</button>
      <button class="dir-btn" data-dir="to bottom">垂直 ↓</button>
      <button class="dir-btn" data-dir="to bottom right">对角线 ↘</button>
      <button class="dir-btn" data-dir="to bottom left">对角线 ↙</button>
    </div>

    <!-- ===== CSS 代码 ===== -->
    <div class="code-box">
      <code id="cssCode">background: linear-gradient(to right, #e8d5c4, #d4c4b8, #c4b8a8, #b8a898, #a89888);</code>
      <button class="copy-btn" id="copyBtn">复制代码</button>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast">💡 点击色块复制色值 · 按空格生成新渐变</div>

    <!-- ===== 底部 ===== -->
    <div class="footer-info">
      <span>按 <kbd>空格</kbd> 生成新渐变</span>
      <span>🌿 5色莫兰迪渐变 · 复制即用</span>
    </div>

  </div>

  <script>
    /* ================================================================
       🌅 莫兰迪渐变色工具 · 5色版
       ================================================================ */

    // ---- DOM 引用 ----
    const preview = document.getElementById('gradientPreview')
    const colorStopsEl = document.getElementById('colorStops')
    const familyTagsEl = document.getElementById('familyTags')
    const cssCode = document.getElementById('cssCode')
    const copyBtn = document.getElementById('copyBtn')
    const generateBtn = document.getElementById('generateBtn')
    const toast = document.getElementById('toast')
    const dirBtns = document.querySelectorAll('.dir-btn')

    // ---- 状态 ----
    let currentColors = [] // [{ hex, h, s, l }]
    let currentDirection = 'to right'

    // ================================================================
    // 颜色工具
    // ================================================================

    function hslToHex(h, s, l) {
      const s1 = s / 100,
        l1 = l / 100
      const c = (1 - Math.abs(2 * l1 - 1)) * s1
      const x = c * (1 - Math.abs((h / 60) % 2 - 1))
      const m = l1 - c / 2
      let r, g, b
      if (h >= 0 && h < 60) { r = c;
        g = x;
        b = 0 } else if (h >= 60 && h < 120) { r = x;
        g = c;
        b = 0 } else if (h >= 120 && h < 180) { r = 0;
        g = c;
        b = x } else if (h >= 180 && h < 240) { r = 0;
        g = x;
        b = c } else if (h >= 240 && h < 300) { r = x;
        g = 0;
        b = c } else { r = c;
        g = 0;
        b = x }
      const r255 = Math.round((r + m) * 255)
      const g255 = Math.round((g + m) * 255)
      const b255 = Math.round((b + m) * 255)
      return '#' + [r255, g255, b255].map(c => c.toString(16).padStart(2, '0')).join('')
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)
      if (!result) return { r: 0, g: 0, b: 0 }
      return { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) }
    }

    function rgbToHsl(r, g, b) {
      const r1 = r / 255,
        g1 = g / 255,
        b1 = b / 255
      const max = Math.max(r1, g1, b1),
        min = Math.min(r1, g1, b1)
      let h, s, l = (max + min) / 2
      if (max === min) { h = 0;
        s = 0 } else {
        const d = max - min
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
        switch (max) {
          case r1:
            h = ((g1 - b1) / d + (g1 < b1 ? 6 : 0)) / 6;
            break
          case g1:
            h = ((b1 - r1) / d + 2) / 6;
            break
          case b1:
            h = ((r1 - g1) / d + 4) / 6;
            break
        }
      }
      return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) }
    }

    function generateMorandiColor() {
      const hue = Math.floor(Math.random() * 360)
      const saturation = 20 + Math.floor(Math.random() * 20)
      const lightness = 45 + Math.floor(Math.random() * 35)
      return { h: hue, s: saturation, l: lightness }
    }

    // ================================================================
    // 色系判断
    // ================================================================

    function getColorFamilies(colors) {
      const families = new Set()
      colors.forEach(hex => {
        const { r, g, b } = hexToRgb(hex)
        const hsl = rgbToHsl(r, g, b)
        const h = hsl.h,
          s = hsl.s,
          l = hsl.l
        let family = ''
        if (l < 20) family = '黑色系'
        else if (l > 85 && s < 20) family = '白色系'
        else if (s < 20 && l >= 20 && l <= 80) family = '灰色系'
        else if (h >= 20 && h < 50 && l < 40) family = '棕色系'
        else if (h >= 300 && h < 350 && s > 30) family = '粉色系'
        else if ((h >= 0 && h < 20) || (h >= 340 && h <= 360)) family = '红色系'
        else if (h >= 20 && h < 50) family = '橙色系'
        else if (h >= 50 && h < 75) family = '黄色系'
        else if (h >= 75 && h < 165) family = '绿色系'
        else if (h >= 165 && h < 250) family = '蓝色系'
        else if (h >= 250 && h < 300) family = '紫色系'
        else if (h >= 300 && h < 340) family = '粉色系'
        else family = '其他'
        families.add(family)
      })
      return Array.from(families)
    }

    function getFamilyEmoji(family) {
      const map = {
        '红色系': '🔴',
        '橙色系': '🟠',
        '黄色系': '🟡',
        '绿色系': '🟢',
        '蓝色系': '🔵',
        '紫色系': '🟣',
        '粉色系': '🌸',
        '棕色系': '🟤',
        '灰色系': '⚪',
        '黑色系': '⬛',
        '白色系': '⬜'
      }
      return map[family] || '📦'
    }

    // ================================================================
    // 生成渐变（5色）
    // ================================================================

    function generateGradient() {
      const colors = []
      for (let i = 0; i < 5; i++) {
        const c = generateMorandiColor()
        const hex = hslToHex(c.h, c.s, c.l)
        colors.push({ hex, h: c.h, s: c.s, l: c.l })
      }
      currentColors = colors
      updatePreview()
      updateColorStops()
      updateFamilyTags()
    }

    function updatePreview() {
      const hexes = currentColors.map(c => c.hex)
      const gradient = `linear-gradient(${currentDirection}, ${hexes.join(', ')})`
      preview.style.background = gradient
      cssCode.textContent = `background: ${gradient};`
    }

    function updateColorStops() {
      colorStopsEl.innerHTML = ''
      currentColors.forEach(color => {
        const item = document.createElement('div')
        item.className = 'color-stop-item'

        const swatch = document.createElement('span')
        swatch.className = 'color-stop-swatch'
        swatch.style.background = color.hex
        item.appendChild(swatch)

        const hexSpan = document.createElement('span')
        hexSpan.className = 'color-stop-hex'
        hexSpan.textContent = color.hex.toUpperCase()
        item.appendChild(hexSpan)

        const hsl = rgbToHsl(
          parseInt(color.hex.slice(1, 3), 16),
          parseInt(color.hex.slice(3, 5), 16),
          parseInt(color.hex.slice(5, 7), 16)
        )
        const hslSpan = document.createElement('span')
        hslSpan.className = 'color-stop-hsl'
        hslSpan.textContent = `H${hsl.h}° S${hsl.s}% L${hsl.l}%`
        item.appendChild(hslSpan)

        // 点击复制色值
        item.addEventListener('click', function() {
          copyToClipboard(color.hex.toUpperCase())
        })

        colorStopsEl.appendChild(item)
      })
    }

    function updateFamilyTags() {
      const hexes = currentColors.map(c => c.hex)
      const families = getColorFamilies(hexes)
      const filtered = families.filter(f => f !== '其他')
      if (filtered.length === 0) {
        familyTagsEl.innerHTML = ''
        return
      }
      familyTagsEl.innerHTML = filtered.map(f =>
        `<span class="family-tag">${getFamilyEmoji(f)} ${f}</span>`
      ).join('')
    }

    // ================================================================
    // 复制功能
    // ================================================================

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(`✅ 已复制 ${text}`)
        }).catch(() => fallbackCopy(text))
      } else {
        fallbackCopy(text)
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea')
      textarea.value = text
      textarea.style.position = 'fixed'
      textarea.style.opacity = '0'
      document.body.appendChild(textarea)
      textarea.select()
      try {
        document.execCommand('copy')
        showToast(`✅ 已复制 ${text}`)
      } catch (err) {
        showToast('⚠️ 复制失败，请手动复制', false)
      }
      document.body.removeChild(textarea)
    }

    function copyCSS() {
      const text = cssCode.textContent
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.textContent = '✅ 已复制'
          copyBtn.classList.add('copied')
          showToast('✅ CSS 代码已复制')
          setTimeout(() => {
            copyBtn.textContent = '复制代码'
            copyBtn.classList.remove('copied')
          }, 2000)
        }).catch(() => fallbackCopyCSS(text))
      } else {
        fallbackCopyCSS(text)
      }
    }

    function fallbackCopyCSS(text) {
      const textarea = document.createElement('textarea')
      textarea.value = text
      textarea.style.position = 'fixed'
      textarea.style.opacity = '0'
      document.body.appendChild(textarea)
      textarea.select()
      try {
        document.execCommand('copy')
        copyBtn.textContent = '✅ 已复制'
        showToast('✅ CSS 代码已复制')
        setTimeout(() => {
          copyBtn.textContent = '复制代码'
        }, 2000)
      } catch (err) {
        showToast('⚠️ 复制失败，请手动复制', false)
      }
      document.body.removeChild(textarea)
    }

    // ================================================================
    // Toast
    // ================================================================

    let toastTimer = null

    function showToast(msg, isSuccess = true) {
      toast.textContent = msg
      toast.classList.add('active')
      toast.style.color = isSuccess ? '#2c7a4a' : '#c0392b'
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => {
        toast.classList.remove('active')
        toast.textContent = '💡 点击色块复制色值 · 按空格生成新渐变'
        toast.style.color = '#8a8a8a'
      }, 2000)
    }

    // ================================================================
    // 方向控制
    // ================================================================

    function setDirection(dir, btn) {
      currentDirection = dir
      dirBtns.forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      if (currentColors.length > 0) {
        updatePreview()
      }
    }

    // ================================================================
    // 事件绑定
    // ================================================================

    generateBtn.addEventListener('click', generateGradient)

    dirBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        setDirection(this.dataset.dir, this)
      })
    })

    copyBtn.addEventListener('click', copyCSS)

    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return
      if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault()
        generateGradient()
      }
    })

    // ================================================================
    // 初始化
    // ================================================================

    generateGradient()
    console.log('🌅 莫兰迪渐变色工具（5色版）已启动！')
    console.log('💡 按空格生成 · 点击色块复制色值 · 点击方向改变角度')
  </script>

</body>
</html>

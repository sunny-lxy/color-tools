<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>🎨 色彩工具</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: #f0ece6;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 1rem;
      color: #8a8a8a;
      margin-bottom: 40px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .mode-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 36px 24px 28px;
      border: 2px solid #e8e4de;
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .mode-card:hover {
      transform: translateY(-4px);
      border-color: #2c2c2c;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
    }

    .mode-card .icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 12px;
    }

    .mode-card h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .mode-card p {
      font-size: 0.85rem;
      color: #8a8a8a;
      line-height: 1.5;
    }

    .mode-card .badge {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.65rem;
      padding: 2px 14px;
      border-radius: 40px;
      background: #f0ece6;
      color: #6a6a6a;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: #b0b0b0;
    }

    @media (max-width: 480px) {
      .mode-grid {
        grid-template-columns: 1fr;
        max-width: 320px;
        margin: 0 auto;
      }
      .header h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>🎨 色彩工具</h1>
      <p>选择一种模式开始探索</p>
    </div>

    <div class="mode-grid">

      <!-- 模式 1：色相环 -->
      <a href="cycle.html" class="mode-card">
        <span class="icon">🌀</span>
        <h3>色相环模式</h3>
        <p>颜色沿色相环平滑旋转，可调速度与步长</p>
        <span class="badge">动态 · 循环</span>
      </a>

      <!-- 模式 2：莫兰迪 -->
      <a href="morandi.html" class="mode-card">
        <span class="icon">🌿</span>
        <h3>莫兰迪模式</h3>
        <p>生成低饱和度柔和配色，点击复制色值</p>
        <span class="badge">静态 · 生成</span>
      </a>
      <!-- 模式 3：渐变 -->
      <a href="gradient.html" class="mode-card">
        <span class="icon">🌅</span>
        <h3>渐变色工具</h3>
        <p>生成莫兰迪色系线性渐变，一键复制 CSS 代码</p>
        <span class="badge">渐变 · 代码</span>
      </a>
    </div>

    <div class="footer">
      <span>💡 点击卡片进入对应模式</span>
    </div>

  </div>

</body>
</html>
